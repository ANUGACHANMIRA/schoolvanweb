<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1f3a"/>
      <stop offset="60%" stop-color="#193863"/>
      <stop offset="100%" stop-color="#2a528a"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="vanYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED136"/>
      <stop offset="50%" stop-color="#FFC20E"/>
      <stop offset="100%" stop-color="#E5A800"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC20E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFC20E" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Sky / Atmosphere -->
  <rect width="1920" height="800" fill="url(#skyGrad)"/>
  <circle cx="1500" cy="200" r="350" fill="url(#accentGlow)"/>
  
  <!-- Subtle Grid Lines / Geometric Accents -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="150" x2="1920" y2="150"/>
    <line x1="0" y1="300" x2="1920" y2="300"/>
    <line x1="0" y1="450" x2="1920" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
    <line x1="1200" y1="0" x2="1200" y2="800"/>
    <line x1="1500" y1="0" x2="1500" y2="800"/>
  </g>

  <!-- Distant City & School Skyline Silhouettes -->
  <g opacity="0.25" fill="#475569">
    <rect x="80" y="320" width="120" height="260" rx="4"/>
    <rect x="230" y="280" width="90" height="300" rx="4"/>
    <rect x="350" y="350" width="140" height="230" rx="4"/>
    <polygon points="520,380 580,310 640,380"/>
    <rect x="540" y="380" width="80" height="200"/>
    <!-- School Clock Tower -->
    <rect x="1450" y="260" width="130" height="320" rx="4"/>
    <polygon points="1440,260 1515,160 1590,260" fill="#64748b"/>
    <circle cx="1515" cy="225" r="22" fill="#FFC20E"/>
    <rect x="1600" y="330" width="180" height="250" rx="4"/>
  </g>

  <!-- Trees along roadway -->
  <g opacity="0.4" fill="#1e3a5f">
    <circle cx="200" cy="540" r="45"/>
    <circle cx="480" cy="550" r="35"/>
    <circle cx="1400" cy="540" r="50"/>
    <circle cx="1700" cy="535" r="55"/>
  </g>

  <!-- Roadway Base -->
  <rect x="0" y="580" width="1920" height="220" fill="url(#roadGrad)"/>
  <!-- Road curb highlight -->
  <rect x="0" y="575" width="1920" height="7" fill="#FFC20E" opacity="0.75"/>
  <!-- Highway lane dashes -->
  <g stroke="#ffffff" stroke-width="8" stroke-dasharray="60 50" opacity="0.65">
    <line x1="0" y1="690" x2="1920" y2="690"/>
  </g>

  <!-- HERO GRAPHIC: Premium Modern School Van Vector -->
  <g transform="translate(980, 290)" filter="url(#shadow)">
    <!-- Shadow under van -->
    <ellipse cx="400" cy="360" rx="360" ry="24" fill="#000000" opacity="0.6"/>

    <!-- Main Van Chassis -->
    <path d="M 60,300 
             L 60,180 
             Q 60,130 110,120 
             L 240,110 
             L 520,110 
             Q 660,110 710,180 
             L 740,240 
             Q 760,260 760,290 
             L 760,315 
             Q 760,330 740,330 
             L 60,330 Z" 
          fill="url(#vanYellow)" stroke="#B38600" stroke-width="3"/>

    <!-- Dark Lower Body Trim & Protective Side Skirt -->
    <path d="M 60,295 L 755,295 L 755,330 L 60,330 Z" fill="#0B1F3A"/>

    <!-- Van Roof Rack & Signal Beacon -->
    <rect x="180" y="95" width="380" height="15" rx="5" fill="#334155"/>
    <rect x="220" y="80" width="30" height="18" rx="4" fill="#E11D48"/>
    <rect x="490" y="80" width="30" height="18" rx="4" fill="#FFC20E"/>
    
    <!-- Windshield & Passenger Windows -->
    <!-- Rear/Mid Windows -->
    <rect x="120" y="145" width="110" height="95" rx="8" fill="#0F172A" stroke="#334155" stroke-width="4"/>
    <rect x="250" y="145" width="120" height="95" rx="8" fill="#0F172A" stroke="#334155" stroke-width="4"/>
    <rect x="390" y="145" width="130" height="95" rx="8" fill="#0F172A" stroke="#334155" stroke-width="4"/>
    <!-- Driver Window -->
    <path d="M 540,145 L 670,145 Q 700,165 715,225 L 715,240 L 540,240 Z" fill="#0F172A" stroke="#334155" stroke-width="4"/>

    <!-- Window Gloss Highlights -->
    <polygon points="130,150 170,150 140,230 130,230" fill="#ffffff" opacity="0.2"/>
    <polygon points="260,150 300,150 270,230 260,230" fill="#ffffff" opacity="0.2"/>
    <polygon points="400,150 440,150 410,230 400,230" fill="#ffffff" opacity="0.2"/>
    <polygon points="555,150 600,150 575,230 555,230" fill="#ffffff" opacity="0.2"/>

    <!-- Characteristic Van Side Stripe & Branding -->
    <rect x="60" y="255" width="690" height="24" fill="#0B1F3A"/>
    <text x="370" y="272" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#FFC20E" letter-spacing="4" text-anchor="middle">SAFE RIDE SCHOOL TRANSPORT</text>

    <!-- Side Door Handle & Mirrors -->
    <rect x="490" y="260" width="30" height="7" rx="3" fill="#ffffff"/>
    <rect x="580" y="260" width="30" height="7" rx="3" fill="#ffffff"/>
    <!-- Side Mirror -->
    <rect x="690" y="180" width="22" height="42" rx="6" fill="#1E293B"/>

    <!-- Front Headlights (Illuminated LED) -->
    <path d="M 735,245 L 755,250 L 755,275 L 735,275 Z" fill="#FFFFFF"/>
    <!-- Headlight Beam Flare -->
    <polygon points="755,245 1050,190 1050,420 755,280" fill="#FEF08A" opacity="0.18"/>

    <!-- Tail Lights -->
    <rect x="60" y="200" width="8" height="50" rx="3" fill="#EF4444"/>

    <!-- Wheel Wells & Wheels -->
    <!-- Rear Wheel -->
    <circle cx="210" cy="330" r="62" fill="#0B1F3A"/>
    <circle cx="210" cy="330" r="50" fill="#1E293B"/>
    <circle cx="210" cy="330" r="28" fill="#94A3B8"/>
    <circle cx="210" cy="330" r="12" fill="#0B1F3A"/>
    <!-- Front Wheel -->
    <circle cx="620" cy="330" r="62" fill="#0B1F3A"/>
    <circle cx="620" cy="330" r="50" fill="#1E293B"/>
    <circle cx="620" cy="330" r="28" fill="#94A3B8"/>
    <circle cx="620" cy="330" r="12" fill="#0B1F3A"/>

    <!-- Stop Sign Arm on Van -->
    <polygon points="180,180 200,165 220,180 220,205 200,220 180,205" fill="#DC2626" stroke="#FFFFFF" stroke-width="3"/>
    <text x="200" y="197" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">STOP</text>
  </g>

  <!-- Left Floating Badge: 100% Punctual & Safe -->
  <g transform="translate(140, 180)" filter="url(#shadow)">
    <rect width="280" height="95" rx="16" fill="#0B1F3A" fill-opacity="0.85" stroke="#FFC20E" stroke-width="2"/>
    <circle cx="50" cy="48" r="28" fill="#FFC20E"/>
    <!-- Shield Icon -->
    <path d="M 40,40 L 50,35 L 60,40 L 60,50 Q 50,60 50,60 Q 40,60 40,50 Z" fill="#0B1F3A"/>
    <text x="95" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#FFC20E">SAFETY FIRST FLEET</text>
    <text x="95" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#E2E8F0">Certified Drivers & Belts</text>
  </g>

  <g transform="translate(140, 305)" filter="url(#shadow)">
    <rect width="280" height="95" rx="16" fill="#0B1F3A" fill-opacity="0.85" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="50" cy="48" r="28" fill="#38BDF8"/>
    <!-- Satellite Icon -->
    <circle cx="50" cy="48" r="12" fill="#0B1F3A"/>
    <circle cx="50" cy="48" r="4" fill="#38BDF8"/>
    <path d="M 38,36 A 18 18 0 0 1 62 36" fill="none" stroke="#0B1F3A" stroke-width="2.5"/>
    <text x="95" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8">REAL-TIME GPS</text>
    <text x="95" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#E2E8F0">Live App Tracking for Parents</text>
  </g>
</svg>
