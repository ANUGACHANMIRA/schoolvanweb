<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="mapGrid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="800" fill="url(#bgGrad2)"/>

  <!-- Interactive Map Vector Style Backdrop -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="2" fill="none">
    <!-- Map Streets / Highways -->
    <path d="M 0,200 Q 400,280 800,220 T 1600,260 T 1920,200"/>
    <path d="M 0,450 Q 500,400 950,480 T 1920,430"/>
    <path d="M 300,0 C 350,300 250,500 320,800"/>
    <path d="M 850,0 C 800,250 900,550 870,800"/>
    <path d="M 1400,0 C 1450,350 1380,600 1420,800"/>
    <!-- City block outlines -->
    <rect x="400" y="260" width="160" height="120" rx="8"/>
    <rect x="600" y="260" width="180" height="150" rx="8"/>
    <rect x="1000" y="240" width="220" height="160" rx="8"/>
    <rect x="1500" y="280" width="180" height="130" rx="8"/>
  </g>

  <!-- Active Route Path with Glowing Pulse -->
  <path d="M 200,600 C 450,580 550,420 850,420 C 1150,420 1200,320 1600,300" 
        fill="none" stroke="#FFC20E" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 10"/>
  <path d="M 200,600 C 450,580 550,420 850,420 C 1150,420 1200,320 1600,300" 
        fill="none" stroke="#FFC20E" stroke-width="14" stroke-linecap="round" opacity="0.25" filter="url(#glow)"/>

  <!-- Route Stops / Waypoints -->
  <!-- Stop 1: Pickup Point -->
  <g transform="translate(200, 600)" filter="url(#shadow2)">
    <circle cx="0" cy="0" r="26" fill="#38BDF8"/>
    <circle cx="0" cy="0" r="14" fill="#0B1F3A"/>
    <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
    <rect x="-60" y="-60" width="120" height="30" rx="6" fill="#0B1F3A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="0" y="-40" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#38BDF8" text-anchor="middle">Pickup: 7:15 AM</text>
  </g>

  <!-- Stop 2: En Route -->
  <g transform="translate(850, 420)" filter="url(#shadow2)">
    <circle cx="0" cy="0" r="32" fill="#FFC20E" opacity="0.3" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="24" fill="#FFC20E"/>
    <circle cx="0" cy="0" r="12" fill="#0B1F3A"/>
    <rect x="-70" y="-60" width="140" height="30" rx="6" fill="#0B1F3A" stroke="#FFC20E" stroke-width="1.5"/>
    <text x="0" y="-40" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#FFC20E" text-anchor="middle">Live: Van #04 Moving</text>
  </g>

  <!-- Stop 3: School Arrival Point -->
  <g transform="translate(1600, 300)" filter="url(#shadow2)">
    <circle cx="0" cy="0" r="28" fill="#10B981"/>
    <circle cx="0" cy="0" r="16" fill="#0B1F3A"/>
    <!-- Flag / Check -->
    <path d="M -4,-8 L 6,-8 L 2,-1 L 6,6 L -4,6 Z" fill="#10B981"/>
    <line x1="-4" y1="-8" x2="-4" y2="10" stroke="#10B981" stroke-width="2"/>
    <rect x="-65" y="-60" width="130" height="30" rx="6" fill="#0B1F3A" stroke="#10B981" stroke-width="1.5"/>
    <text x="0" y="-40" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#10B981" text-anchor="middle">School: 7:45 AM</text>
  </g>

  <!-- Right Hero Visual: Smartphone Parent App Mockup -->
  <g transform="translate(1180, 140)" filter="url(#shadow2)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="340" height="580" rx="42" fill="#020617" stroke="#475569" stroke-width="5"/>
    <!-- Phone Screen -->
    <rect x="15" y="18" width="310" height="544" rx="30" fill="#0F172A"/>
    <!-- Top Speaker Notch -->
    <rect x="120" y="26" width="100" height="14" rx="7" fill="#1E293B"/>

    <!-- App Top Bar -->
    <rect x="15" y="55" width="310" height="60" fill="#0B1F3A"/>
    <text x="40" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#FFC20E">SafeRide Guardian</text>
    <circle cx="295" cy="85" r="8" fill="#10B981"/>

    <!-- App Map View inside phone -->
    <rect x="30" y="130" width="280" height="260" rx="16" fill="#1E293B"/>
    <!-- Mini map lines -->
    <path d="M 40,240 Q 150,220 280,260" stroke="#475569" stroke-width="4" fill="none"/>
    <path d="M 160,140 L 170,380" stroke="#475569" stroke-width="4" fill="none"/>
    <path d="M 70,300 C 120,280 180,220 250,180" stroke="#FFC20E" stroke-width="5" fill="none"/>
    <!-- Van Pin on Phone -->
    <g transform="translate(180, 220)">
      <circle cx="0" cy="0" r="16" fill="#FFC20E"/>
      <rect x="-8" y="-5" width="16" height="10" rx="2" fill="#0B1F3A"/>
    </g>

    <!-- App Bottom Card: ETA & Driver Info -->
    <rect x="30" y="410" width="280" height="130" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="65" cy="450" r="22" fill="#FFC20E"/>
    <text x="65" y="456" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0B1F3A" text-anchor="middle">JD</text>
    <text x="100" y="445" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#F8FAFC">John Davis (Driver)</text>
    <text x="100" y="465" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8">Van #4 • Toyota HiAce</text>
    <line x1="45" y1="485" x2="295" y2="485" stroke="#334155" stroke-width="1"/>
    <text x="45" y="515" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#38BDF8">STATUS: En route to Oakridge High</text>
    <text x="250" y="515" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#10B981">ETA 4 min</text>
  </g>
</svg>
